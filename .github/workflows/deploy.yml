name: Deploy
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
        # run: |
        #   echo "Cloning Repo ..."
        #   echo "${{toJson(github)}}"
        #   git clone https://github.com/${{github.repository}}.git
      - name: Install node js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: "node version"
        run: node -v
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:unit
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Node js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
      - name: Deploy
        run: echo "deploy successfully"
